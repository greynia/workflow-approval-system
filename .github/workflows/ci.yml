name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Spring Boot (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Integration tests boot a real pgvector/pgvector:pg16 container via
      # Testcontainers. AiReviewPort / EmbeddingPort / RerankPort are replaced by
      # deterministic offline stubs in TestcontainersConfiguration, so no LLM API
      # key is required — CI stays reproducible and free.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check i18n key parity
        run: npm run check:i18n

      - name: Build
        run: npm run build

  agent:
    name: Agent · guardrail evals (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      # uv, not pip: agent/uv.lock pins the toolchain, and the repo already
      # documents `uv --directory agent sync`. Installing with pip would resolve
      # `ruff>=0.5` to whatever is newest and fail on rules the lockfile never
      # agreed to — CI must lint with the same version the author runs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
          # requires-python is a floor (">=3.11"), and there is no
          # .python-version, so uv would otherwise pick whatever interpreter it
          # finds. Pin the declared minimum so CI tests the version we claim.
          python-version: '3.11'

      - name: Install (locked)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      # pytest testpaths = ["tests", "evals"] — this also runs the hard-rule-floor
      # guardrail evals, so a regression that lets the LLM downgrade a risk level
      # fails the build rather than shipping silently.
      - name: Test and guardrail evals
        run: uv run pytest
