spring.application.name=workflow-approval
spring.docker.compose.enabled=false
spring.config.import=optional:classpath:application-local.properties
spring.messages.basename=messages

server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

app.jwt.secret=change-this-secret-key-to-at-least-32-bytes
app.jwt.expiration-seconds=3600
app.jwt.refresh-expiration-seconds=604800
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=X-Request-ID
app.cors.allow-credentials=true

spring.jackson.serialization.write-dates-as-timestamps=false

# app.ai.provider=LOCAL
app.ai.provider=GEMINI
app.ai.fallback-enabled=true
app.ai.ollama.base-url=http://localhost:11434
app.ai.ollama.model=llama3.1:8b
app.ai.ollama.timeout-seconds=60
# Gemini: set APP_AI_GEMINI_API_KEY env var (or app.ai.gemini.api-key in local config) to enable
app.ai.gemini.model=gemini-2.5-flash-lite
app.ai.gemini.embedding-model=text-embedding-004
app.ai.gemini.timeout-seconds=30

# Policy RAG: auto-ingest the policy doc into pgvector on startup when the table is empty
app.ai.policy.auto-ingest=true

app.taiwan-calendar.base-url=https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data
